<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ingresar — Interventoría PRO</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/ip.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <img src="assets/logo.png" alt="CINCO S.A.S.">
      </div>
      <h1>Interventoría PRO</h1>
      <p class="text-muted ip-login-sub">Seguimiento contractual mes a mes: administrativo, financiero, jurídico, SST, social, ambiental, técnico y riesgos.</p>
      <form id="loginForm">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required autocomplete="current-password">
        <div class="alert" id="loginAlert"></div>
        <button type="submit" class="btn" id="loginBtn">Ingresar</button>
      </form>
      <p class="text-muted ip-login-nota">Usa la misma cuenta del Control de Contratos de Cinco S.A.S. o de Cinco Conecta.</p>
    </div>
  </div>
  <script type="module" src="js/ip-login.js"></script>
</body>
</html>
