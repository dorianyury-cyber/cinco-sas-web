<!doctype html>
<html lang="es" class="ip-preparando">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tablero de contratos — Interventoría PRO</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="stylesheet" href="assets/ip.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <header id="ipHeader"></header>
      <p class="text-muted ip-descripcion">Todos tus contratos en una sola vista: tiempo, avance técnico y financiero, y las alertas de cada uno. Haz clic en un contrato para ver su detalle.</p>
      <div id="tbTarjetas"><div class="card"><p class="text-muted ip-sin-margen">Revisando los contratos…</p></div></div>
      <div class="card ip-barra ip-barra-centro">
        <select id="tbFiltro" class="ip-filtro-mes">
          <option value="">Todos los estados</option>
          <option value="riesgo">🔴 En riesgo</option>
          <option value="atencion">🟡 Requieren atención</option>
          <option value="ok">🟢 Al día</option>
        </select>
        <label class="ip-check-linea"><input type="checkbox" id="tbSoloActivos" checked> Solo contratos activos</label>
        <button type="button" class="btn secondary" id="tbExcelBtn">📊 Exportar a Excel</button>
        <span class="text-muted ip-contador" id="tbContador"></span>
      </div>
      <div id="tbLista"></div>
      <div id="tbDetalle"></div>
    </main>
  </div>
  <script src="../js/vendor/exceljs.min.js"></script>
  <script type="module" src="js/ip-tablero.js"></script>
</body>
</html>
