<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Control de Contratos — Cinco S.A.S.</title>
<link rel="icon" href="../assets/img/logo-texto-oscuro.png">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html">
        <img src="../assets/img/logo.png" alt="Cinco S.A.S.">
      </a>
    </div>
  </header>

  <div class="page-banner">
    <div class="container">
      <span class="eyebrow">Uso interno</span>
      <h1>Control de Contratos</h1>
      <p>Servicio al Cliente, Talento Humano y Actividades, contrato por contrato.</p>
    </div>
  </div>

  <section class="section">
    <div class="container control-container-angosto">
      <div class="card">
        <form class="pqr-form" id="loginForm">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username">

          <label for="clave">Clave</label>
          <input type="password" id="clave" required autocomplete="current-password">

          <button type="submit" class="btn" id="loginBtn">Ingresar</button>
          <div class="form-alert" id="loginAlert"></div>
        </form>
      </div>
    </div>
  </section>

  <script type="module" src="../js/control/auth.js"></script>
</body>
</html>
