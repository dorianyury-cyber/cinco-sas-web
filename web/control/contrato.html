<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Contrato — Control de Contratos — Cinco S.A.S.</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../conecta.html">
        <img src="../assets/img/logo.png" alt="Cinco S.A.S.">
      </a>
      <div class="control-userbar">
        <span id="userEmail"></span>
        <a href="documentos.html" class="control-userbar-link">Documentos</a>
        <a href="correspondencia.html" class="control-userbar-link">Correspondencia</a>
        <a href="empleados.html" class="control-userbar-link">Empleados</a>
        <a href="cambiar-clave.html" class="control-userbar-link">Cambiar clave</a>
        <button id="logoutBtn" class="btn-outline">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div class="page-banner">
    <div class="container">
      <span class="eyebrow"><a href="contratos.html" class="control-volver">← Contratos</a></span>
      <h1 id="contratoNombre">Cargando…</h1>
      <p id="contratoCliente"></p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="card control-cabecera">
        <div>
          <span class="control-badge control-badge-lg" id="contratoCodigo"></span>
          <span class="pill" id="contratoTipo"></span>
          <span class="text-muted" id="contratoNumero"></span>
        </div>
        <div class="control-cabecera-datos">
          <label>Inicio: <span id="contratoFechaInicio"></span></label>
          <label>Estado:
            <select id="contratoEstado">
              <option value="activo">Activo</option>
              <option value="cerrado">Cerrado</option>
            </select>
          </label>
          <span class="control-badge control-badge-lg" id="avanceGeneral"></span>
          <button id="borrarContratoBtn" class="control-btn-danger oculto">Borrar contrato</button>
        </div>
      </div>

      <div id="camposContainer"></div>

      <details class="card control-campo" open>
        <summary><span>Equipo asignado</span><span class="control-badge" id="equipoBadge"></span></summary>
        <div id="equipoLista" class="control-equipo-lista"></div>
        <form id="agregarEquipoForm" class="control-equipo-form oculto">
          <select id="equipoSelect"></select>
          <button type="submit" class="control-btn-mini">+ Agregar al equipo</button>
        </form>
        <div class="form-alert" id="equipoAlert"></div>
      </details>

      <details class="card control-campo" open>
        <summary><span>Documentos del contrato</span><span class="control-badge" id="documentosBadge"></span></summary>
        <div class="control-tabla-wrap">
          <table class="control-tabla-documentos">
            <colgroup>
              <col class="w-120">
              <col>
              <col class="w-90">
              <col class="w-110">
              <col class="w-90">
            </colgroup>
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listaDocumentosContrato"></tbody>
          </table>
        </div>
        <p id="sinDocumentosContrato" class="text-muted oculto">Todavía no hay documentos archivados en este contrato.</p>

        <details class="control-nuevo">
          <summary>+ Agregar documento manual</summary>
          <form class="pqr-form" id="nuevoDocumentoManualForm">
            <label for="docNombre">Nombre</label>
            <input type="text" id="docNombre" required maxlength="160">

            <label for="docTipo">Tipo</label>
            <select id="docTipo" required>
              <option value="interno">Interno</option>
              <option value="externo">Externo</option>
            </select>

            <label for="docEnlace">Enlace</label>
            <input type="url" id="docEnlace" required maxlength="500">

            <button type="submit" class="btn" id="agregarDocumentoBtn">Agregar</button>
            <div class="form-alert" id="nuevoDocumentoManualAlert"></div>
          </form>
        </details>
      </details>
    </div>
  </section>

  <script type="module" src="../js/control/contrato-detalle.js"></script>
</body>
</html>
